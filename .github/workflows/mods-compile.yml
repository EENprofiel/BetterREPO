name: Compile mods
on:
  pull_request:
    paths: ["mods/**", ".github/workflows/mods-compile.yml"]
  push:
    branches: [main]
    paths: ["mods/**", ".github/workflows/mods-compile.yml"]
  workflow_dispatch:
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Fetch MenuLib and REPOLib reference DLLs
        working-directory: mods/VanillaOrModded
        run: |
          mkdir -p lib
          fetch() {
            curl -fsSL -o "$RUNNER_TEMP/$2.zip" "https://thunderstore.io/package/download/$1/$2/$3/"
            unzip -j -o "$RUNNER_TEMP/$2.zip" "*$2.dll" -d lib
          }
          fetch nickklmao MenuLib 2.5.4
          fetch Zehs REPOLib 4.2.0
      - name: Build every mod against the NuGet game stubs
        run: |
          for p in VanillaOrModded TruckEnergyDisplay OwnedEquipmentHUD BetterReviveHealth; do
            dotnet build "mods/$p/$p.csproj" -c Release
          done
      - name: Run test projects
        run: |
          shopt -s nullglob
          for p in mods/*/tests/*.csproj mods/*/*.Tests/*.csproj; do
            dotnet run --project "$p" -c Release || exit 1
          done
