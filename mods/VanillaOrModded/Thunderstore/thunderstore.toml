[config]
schemaVersion = "0.0.1"

[package]
namespace = "profiel"
name = "VanillaOrModded"
versionNumber = "1.0.0"
description = "Vote for a vanilla, modded, or random map type; the host then selects a non-repeating map while keeping its name a surprise."
websiteUrl = ""
containsNsfwContent = false

[package.dependencies]
"BepInEx-BepInExPack" = "5.4.2305"
"nickklmao-MenuLib" = "2.5.4"
"Zehs-REPOLib" = "4.2.0"

[build]
icon = "../icon.png"
readme = "../README.md"
outdir = "../dist"

[[build.copy]]
source = "../bin/Release/netstandard2.1/VanillaOrModded.dll"
target = "/"

[[build.copy]]
source = "../CHANGELOG.md"
target = "/"

[[build.copy]]
source = "../LICENSE"
target = "/"

[publish]
repository = "https://thunderstore.io"
communities = ["repo"]
categories = ["mods", "levels"]
